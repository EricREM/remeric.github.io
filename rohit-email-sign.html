<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rohit Mulki Email Signature</title>

<style type="text/css">

table, td {
    mso-table-lspace: 0pt;
    mso-table-rspace: 0pt;
    border-collapse: collapse;
}

img {
    border: 0;
    outline: none;
    text-decoration: none;
    -ms-interpolation-mode: bicubic;
}

@media only screen and (max-width:480px) {

    .signature-table {
        width: 390px !important;
        max-width: 390px !important;
    }

    .avatar-cell {
        width: 92px !important;
    }

    .avatar-img {
        width: 88px !important;
        height: 88px !important;
    }

    .info-cell {
        width: 177px !important;
        padding-left: 8px !important;
        padding-right: 3px !important;
    }

    .name {
        font-size: 18px !important;
    }

    .fsp {
        font-size: 9px !important;
    }

    .title {
        font-size: 12px !important;
    }

    .contact {
        font-size: 10.5px !important;
    }

    .contact-icon {
        width: 15px !important;
        margin-right: 5px !important;
    }

    .divider {
        height: 105px !important;
    }

    .logo-cell {
        width: 105px !important;
        padding-left: 7px !important;
    }

    .logo-img {
        width: 100px !important;
    }

    .tagline {
        font-size: 10px !important;
    }
}

</style>
</head>


<body style="margin:0; padding:0; background:#ffffff;">

<table
    class="signature-table"
    width="450"
    cellpadding="0"
    cellspacing="0"
    border="0"
    role="presentation"
    style="
        width:450px;
        max-width:450px;
        font-family:Arial, Helvetica, sans-serif;
        border-collapse:collapse;
    "
>

<tr valign="middle">

    <!-- ========================= -->
    <!-- LEFT: AVATAR -->
    <!-- ========================= -->

    <td
        class="avatar-cell"
        width="105"
        valign="middle"
        style="
            width:105px;
            padding:0;
            vertical-align:middle;
        "
    >

        <img
            class="avatar-img"
            src="team/1.jpg"
            width="120"
            height="120"
            alt="Rohit Mulkia"
            style="
                display:block;
                width:120px;
                height:120px;
                border-radius:50%;
                border:1px solid #ed2633;
            "
        >

    </td>


    <!-- ========================= -->
    <!-- MIDDLE: PERSONAL DETAILS -->
    <!-- ========================= -->

    <td
        class="info-cell"
        width="205"
        valign="middle"
        style="
            width:205px;
            padding-left:8px;
            padding-right:4px;
            vertical-align:middle;
        "
    >

        <!-- NAME + FSP -->

        <div
            class="name"
            style="
                font-family:Arial, Helvetica, sans-serif;
                font-size:20px;
                line-height:22px;
                font-weight:bold;
                color:#000000;
                white-space:nowrap;
            "
        >
            Rohit Mulki
            <span
                class="fsp"
                style="
                    font-size:10px;
                    color:#777777;
                    font-weight:normal;
                    white-space:nowrap;
                "
            >FSP1012031</span>
        </div>


        <!-- JOB TITLE -->

        <div
            class="title"
            style="
                font-family:Arial, Helvetica, sans-serif;
                font-size:14px;
                line-height:18px;
                color:#000000;
                padding-bottom:5px;
                border-bottom:2px solid #ed2633;
                margin-top:3px;
                margin-bottom:3px;
            "
        >
            Director &amp; Financial Adviser
        </div>


        <!-- CONTACT DETAILS -->

        <div
            class="contact"
            style="
                font-family:Arial, Helvetica, sans-serif;
                font-size:12px;
                line-height:22px;
                color:#000000;
                white-space:nowrap;
            "
        >

            <!-- PHONE -->

            <img
                class="contact-icon"
                src="icon-phone.png"
                width="17"
                alt=""
                style="
                    width:17px;
                    vertical-align:middle;
                    margin-right:6px;
                "
            >

            <a
                href="tel:+640274526390"
                style="
                    color:#000000;
                    text-decoration:none;
                "
            >027 452 6390</a>

            <br>


            <!-- EMAIL -->

            <img
                class="contact-icon"
                src="icon-mail.png"
                width="17"
                alt=""
                style="
                    width:17px;
                    vertical-align:middle;
                    margin-right:6px;
                "
            >

            <a
                href="mailto:Rohit.Mulki@remfinance.co.nz"
                style="
                    color:#000000;
                    text-decoration:none;
                "
            >Rohit.Mulki@remfinance.co.nz</a>

            <br>


            <!-- WEBSITE -->

            <img
                class="contact-icon"
                src="icon-web.png"
                width="17"
                alt=""
                style="
                    width:17px;
                    vertical-align:middle;
                    margin-right:6px;
                "
            >

            <a
                href="https://www.remfinance.co.nz"
                style="
                    color:#000000;
                    text-decoration:none;
                "
            >www.remfinance.co.nz</a>

        </div>

    </td>


    <!-- ========================= -->
    <!-- RED DIVIDER -->
    <!-- ========================= -->

    <td
        width="3"
        valign="middle"
        style="
            width:3px;
            padding:0;
            vertical-align:middle;
        "
    >

        <div
            class="divider"
            style="
                width:3px;
                height:115px;
                background:#ed2633;
                font-size:0;
                line-height:0;
            "
        >&nbsp;</div>

    </td>


    <!-- ========================= -->
    <!-- RIGHT: REM LOGO -->
    <!-- ========================= -->

    <td
        class="logo-cell"
        width="125"
        align="center"
        valign="middle"
        style="
            width:125px;
            padding-left:8px;
            vertical-align:middle;
            text-align:center;
        "
    >

        <img
            class="logo-img"
            src="rem-logo-red.png"
            width="115"
            alt="REM"
            style="
                display:block;
                width:115px;
                height:auto;
                margin:0 auto;
            "
        >


        <div
            class="tagline"
            style="
                font-family:Arial, Helvetica, sans-serif;
                font-size:11px;
                line-height:14px;
                color:#ed2633;
                text-align:center;
                margin-top:5px;
                white-space: nowrap;
            "
        >
            Reach Every Milestone
        </div>

    </td>

</tr>

</table>

</body>
</html>
